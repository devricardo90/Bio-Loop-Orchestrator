services:
  postgres:
    image: postgres:17-alpine
    container_name: bio-loop-e2e-postgres
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: bio_loop
      POSTGRES_PASSWORD: bio_loop_dev
      POSTGRES_DB: bio_loop
    volumes:
      - bio-loop-e2e-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bio_loop -d bio_loop"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: bio-loop-e2e-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - bio-loop-e2e-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  bio-loop-e2e-postgres-data:
  bio-loop-e2e-redis-data:
